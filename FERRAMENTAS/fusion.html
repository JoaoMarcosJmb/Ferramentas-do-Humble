<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Fusion Dex Maker - Humble</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- ESTILOS VISUAIS --- */
        body {
            margin: 0;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #dcddde;
            background:
                linear-gradient(rgba(22,26,35,0.92), rgba(22,26,35,0.92)),
                url("../IMAGENS/Fundo.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 30px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #1e293b;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 50px;
            flex-shrink: 0;
        }

        .nav-left { display: flex; align-items: center; gap: 25px; }
        .nav-brand { display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 18px; }
        .nav-brand img { height: 30px; width: auto; border-radius: 50%; }

        .nav-back { 
            color: #94a3b8; text-decoration: none; font-size: 14px; 
            font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .nav-back:hover { color: #fff; transform: translateX(-2px); }

        .nav-actions { display: flex; gap: 10px; }

        .action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid #334155;
            color: #e5e7eb;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            display: flex; align-items: center; gap: 5px;
            font-weight: 600; transition: 0.2s;
        }
        .action-btn:hover { background: #334155; }
        .action-btn.copy { background: #00b0f4; border-color: #00b0f4; color: #fff; }
        .action-btn.copy:hover { background: #0088bd; }
        .action-btn.import { background: #eab308; border-color: #eab308; color: #000; }
        .action-btn.import:hover { background: #ca8a04; }

        /* --- GRID PRINCIPAL --- */
        .main-grid {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            height: auto;
        }

        /* --- EDITOR (ESQUERDA) --- */
        .editor-panel {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex; flex-direction: column;
            height: calc(100vh - 120px);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .editor-content { padding: 20px; overflow-y: auto; flex: 1; }

        details { background: #1e293b; margin-bottom: 10px; border-radius: 5px; overflow: hidden; border: 1px solid #334155; }
        summary { padding: 12px; cursor: pointer; font-weight: bold; background: #252f42; list-style: none; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        summary::after { content: "+"; font-size: 16px; }
        details[open] summary::after { content: "-"; }
        
        .control-group { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; display: block; }
        
        input, textarea, select { 
            box-sizing: border-box; background: #0b1120; border: 1px solid #334155; 
            color: #e2e8f0; padding: 10px 12px; border-radius: 4px; width: 100%; 
            font-family: 'Consolas', monospace; font-size: 13px; outline: none; transition: 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: #00b0f4; background: #111827; }

        .set-group { border-top: 1px solid #334155; padding-top: 10px; margin-top: 5px; display: flex; flex-direction: column; gap: 8px; }
        .set-group:first-child { border-top: none; padding-top: 0; margin-top: 0; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* --- PREVIEW (DIREITA) --- */
        .preview-panel {
            background: #313338;
            border-radius: 8px;
            padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto;
            height: calc(100vh - 120px);
            border: 1px solid #1e293b;
        }

        .discord-msg { display: flex; gap: 12px; font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; line-height: 1.375rem;}
        
        .bot-avatar { 
            width: 40px; height: 40px; border-radius: 50%; 
            background-image: url('../IMAGENS/Mascote.png'); 
            background-size: cover; 
            flex-shrink: 0; margin-top: 2px;
        }
        
        .msg-content { width: 100%; }
        .bot-name { color: #f2f3f5; font-weight: 500; display: flex; align-items: center; gap: 5px; }
        .bot-tag { background: #5865F2; color: #fff; font-size: 10px; padding: 1px 4px; border-radius: 3px; line-height: 1.3; margin-top: 1px;}
        .timestamp { font-size: 12px; color: #949BA4; margin-left: 5px; font-weight: 400;}

        .discord-embed {
            margin-top: 8px; 
            background: #2b2d31; 
            border-left: 4px solid #202225;
            border-radius: 4px; 
            padding: 16px; 
            max-width: 520px; 
            display: flex; flex-direction: column; gap: 8px;
        }
        
        .embed-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .embed-desc { font-size: 14px; color: #dcddde; white-space: pre-wrap; line-height: 1.4; }
        
        .embed-fields { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
        .field-item { flex: 1 1 100%; }
        .field-item.inline { flex: 1 1 45%; min-width: 180px; }
        
        .field-name { font-weight: 600; font-size: 14px; color: #fff; margin-bottom: 2px; }
        .field-value { font-size: 14px; color: #dcddde; white-space: pre-wrap; line-height: 1.375rem; }
        
        .embed-image { width: 100%; max-width: 400px; border-radius: 4px; object-fit: cover; margin-top: 12px; display: none; }
        .embed-footer { font-size: 12px; color: #dcddde; margin-top: 8px; display: flex; align-items: center; gap: 5px;}

        /* Blockquote styling for description */
        .discord-blockquote {
            border-left: 4px solid #4f545c;
            padding-left: 12px;
            margin: 8px 0 0 0;
            color: #b9bbbe;
        }

        /* --- MODAL IMPORT --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            width: 500px; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-title { color: #fff; font-size: 16px; font-weight: bold; }
        .modal-textarea { height: 200px; resize: none; font-family: monospace; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; height: auto; }
            .editor-panel, .preview-panel { height: auto; min-height: 500px; }
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="import-modal">
        <div class="modal-content">
            <div class="modal-title">📥 Importar JSON</div>
            <textarea class="modal-textarea" id="import-area" placeholder="Cole o JSON do seu embed aqui..."></textarea>
            <div class="modal-actions">
                <button class="action-btn" onclick="closeImportModal()">Cancelar</button>
                <button class="action-btn import" onclick="processImport()">Importar</button>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-brand">
                <img src="../IMAGENS/Mascote.png" alt="Logo Mascote">
                <span>Fusion Dex Maker</span>
            </div>
            <a href="../index.html" class="nav-back">⬅ Voltar</a>
        </div>

        <div class="nav-actions">
            <button class="action-btn import" onclick="openImportModal()">📥 Importar JSON</button>
            <button class="action-btn" onclick="clearAll()">🗑️ Limpar</button>
            <button class="action-btn copy" onclick="copyJSON()">📋 Copiar JSON</button>
        </div>
    </nav>

    <div class="main-grid">
        
        <div class="editor-panel">
            <div class="editor-content">
                
                <details open>
                    <summary>Identidade da Dex</summary>
                    <div class="control-group">
                        <label>Nome do Pokémon / Fusão</label>
                        <input type="text" id="inp-name" placeholder="Ex: Skarquaza" oninput="update()">
                        
                        <label>Descrição (Flavor Text)</label>
                        <textarea id="inp-desc" rows="3" placeholder="Um titã dos céus revestido com uma armadura..." oninput="update()"></textarea>

                        <label>Pokémon Base (Para o Aviso de Moveset)</label>
                        <input type="text" id="inp-base" placeholder="Ex: Rayquaza" oninput="update()">
                    </div>
                </details>

                <details open>
                    <summary>Visuais do Embed</summary>
                    <div class="control-group">
                        
                        <label>Preset de Cor (Por Tipagem)</label>
                        <select id="inp-type-color" onchange="applyTypeColor()">
                            <option value="#0a1a34">Customizado (Padrão Escuro)</option>
                            <option value="#A8A77A">Normal</option>
                            <option value="#EE8130">Fogo (Fire)</option>
                            <option value="#6390F0">Água (Water)</option>
                            <option value="#F7D02C">Elétrico (Electric)</option>
                            <option value="#7AC74C">Planta (Grass)</option>
                            <option value="#96D9D6">Gelo (Ice)</option>
                            <option value="#C22E28">Lutador (Fighting)</option>
                            <option value="#A33EA1">Venenoso (Poison)</option>
                            <option value="#E2BF65">Terra (Ground)</option>
                            <option value="#A98FF3">Voador (Flying)</option>
                            <option value="#F95587">Psíquico (Psychic)</option>
                            <option value="#A6B91A">Inseto (Bug)</option>
                            <option value="#B6A136">Pedra (Rock)</option>
                            <option value="#735797">Fantasma (Ghost)</option>
                            <option value="#0a1a34">Dragão (Dragon)</option>
                            <option value="#705746">Sombrio (Dark)</option>
                            <option value="#B7B7CE">Metálico (Steel)</option>
                            <option value="#D685AD">Fada (Fairy)</option>
                        </select>

                        <label>Ajuste Fino de Cor (Hex)</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="color" id="inp-color-picker" value="#0a1a34" style="height: 38px; width: 50px; padding: 0; cursor: pointer;" oninput="syncColorInput(this.value); update()">
                            <input type="text" id="inp-color" value="#0a1a34" oninput="syncColorPicker(this.value); update()">
                        </div>

                        <label>Imagem Principal (URL Grande)</label>
                        <input type="text" id="inp-image" placeholder="https://i.imgur.com/..." oninput="update()">
                    </div>
                </details>

                <details open>
                    <summary>Moves Adicionados</summary>
                    <div class="control-group">
                        <label>Lista de Moves (Separar por vírgula)</label>
                        <textarea id="inp-moves" rows="2" placeholder="Flash Cannon, Body Press, Iron Defense..." oninput="update()"></textarea>
                    </div>
                </details>

                <details>
                    <summary>Builds / Sets Competitivos</summary>
                    <div class="control-group">
                        
                        <!-- SET 1 -->
                        <div class="set-group">
                            <label style="color: #38bdf8;">Set 1</label>
                            <input type="text" id="set1-name" placeholder="Nome (Ex: 🛡️ Set: Skarmoryquaza)" oninput="update()">
                            <input type="text" id="set1-ability" placeholder="Ability (Ex: Levitate)" oninput="update()">
                            <div class="stats-grid">
                                <input type="text" id="set1-nature" placeholder="Nature (Ex: Impish)" oninput="update()">
                                <input type="text" id="set1-item" placeholder="Item (Ex: Rocky Helmet)" oninput="update()">
                            </div>
                            <input type="text" id="set1-evs" placeholder="EVs (Ex: 252 HP / 252 Def / 4 Atk)" oninput="update()">
                            <textarea id="set1-moves" rows="4" placeholder="Moves (Um por linha)&#10;Iron Defense&#10;Body Press..." oninput="update()"></textarea>
                        </div>

                        <!-- SET 2 -->
                        <div class="set-group">
                            <label style="color: #38bdf8;">Set 2</label>
                            <input type="text" id="set2-name" placeholder="Nome (Ex: ⚔️ Set: Sweeper)" oninput="update()">
                            <input type="text" id="set2-ability" placeholder="Ability" oninput="update()">
                            <div class="stats-grid">
                                <input type="text" id="set2-nature" placeholder="Nature" oninput="update()">
                                <input type="text" id="set2-item" placeholder="Item" oninput="update()">
                            </div>
                            <input type="text" id="set2-evs" placeholder="EVs" oninput="update()">
                            <textarea id="set2-moves" rows="4" placeholder="Moves (Um por linha)" oninput="update()"></textarea>
                        </div>

                        <!-- SET 3 -->
                        <div class="set-group">
                            <label style="color: #38bdf8;">Set 3</label>
                            <input type="text" id="set3-name" placeholder="Nome (Ex: ☄️ Set: DracoBurst)" oninput="update()">
                            <input type="text" id="set3-ability" placeholder="Ability" oninput="update()">
                            <div class="stats-grid">
                                <input type="text" id="set3-nature" placeholder="Nature" oninput="update()">
                                <input type="text" id="set3-item" placeholder="Item" oninput="update()">
                            </div>
                            <input type="text" id="set3-evs" placeholder="EVs" oninput="update()">
                            <textarea id="set3-moves" rows="4" placeholder="Moves (Um por linha)" oninput="update()"></textarea>
                        </div>

                        <!-- SET 4 -->
                        <div class="set-group">
                            <label style="color: #38bdf8;">Set 4</label>
                            <input type="text" id="set4-name" placeholder="Nome (Ex: 🌟 Set: ExtremeSpeedSpam)" oninput="update()">
                            <input type="text" id="set4-ability" placeholder="Ability" oninput="update()">
                            <div class="stats-grid">
                                <input type="text" id="set4-nature" placeholder="Nature" oninput="update()">
                                <input type="text" id="set4-item" placeholder="Item" oninput="update()">
                            </div>
                            <input type="text" id="set4-evs" placeholder="EVs" oninput="update()">
                            <textarea id="set4-moves" rows="4" placeholder="Moves (Um por linha)" oninput="update()"></textarea>
                        </div>

                    </div>
                </details>

            </div>
        </div>

        <div class="preview-panel">
            <div class="discord-msg">
                <div class="bot-avatar"></div>
                <div class="msg-content">
                    <div class="bot-name">
                        Humble Bot <span class="bot-tag">BOT</span> <span class="timestamp">Hoje às 15:00</span>
                    </div>

                    <div class="discord-embed" id="embed-preview">
                        <div class="embed-title" id="out-title">Nome do Pokémon</div>
                        <div class="embed-desc" id="out-desc">Descrição aparecerá aqui...</div>
                        
                        <div class="embed-fields" id="out-fields">
                            <!-- Os campos serão gerados aqui dinamicamente -->
                        </div>
                        
                        <img src="" id="out-image" class="embed-image">
                        
                        <div class="embed-footer">Humble Pixelmon • Custom Dex</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getVal(id) { return document.getElementById(id).value; }
        function setVal(id, val) { document.getElementById(id).value = val; }

        // --- COLOR LOGIC ---
        function applyTypeColor() {
            const hex = getVal('inp-type-color');
            setVal('inp-color', hex);
            setVal('inp-color-picker', hex);
            update();
        }

        function syncColorInput(val) {
            setVal('inp-color', val);
            setVal('inp-type-color', '#0a1a34'); // Reseta select para custom
        }

        function syncColorPicker(val) {
            if(val.startsWith('#') && (val.length === 4 || val.length === 7)) {
                setVal('inp-color-picker', val);
            }
            setVal('inp-type-color', '#0a1a34'); // Reseta select para custom
        }

        // --- IMPORT LOGIC ---
        function openImportModal() {
            document.getElementById('import-modal').style.display = 'flex';
        }

        function closeImportModal() {
            document.getElementById('import-modal').style.display = 'none';
        }

        function processImport() {
            const raw = document.getElementById('import-area').value;
            if(!raw.trim()) return closeImportModal();

            try {
                let data = JSON.parse(raw);
                if(data.embeds) data = data.embeds[0];

                // Limpa tudo antes de importar
                document.querySelectorAll('input, textarea').forEach(el => el.value = '');

                setVal('inp-name', data.title || "");
                
                // Pega image ou o antigo thumbnail fallback
                setVal('inp-image', data.image?.url || data.thumbnail?.url || "");
                
                let rawDesc = data.description || "";
                
                // Extrai o moveset base do blockquote
                const baseMatch = rawDesc.match(/> \*Moveset base: \*\*(.*?)\*\*\*\./);
                if(baseMatch) {
                    setVal('inp-base', baseMatch[1]);
                    rawDesc = rawDesc.replace(/> \*Moveset base: \*\*(.*?)\*\*\*\./, '').trim();
                }
                setVal('inp-desc', rawDesc);

                if(data.color) {
                    const hex = '#' + data.color.toString(16).padStart(6, '0');
                    setVal('inp-color-picker', hex);
                    setVal('inp-color', hex);
                    setVal('inp-type-color', '#0a1a34'); // Deixa customizado após import
                }

                if(data.fields) {
                    const movesField = data.fields.find(f => f.name === "Moves Adicionados");
                    if(movesField) setVal('inp-moves', movesField.value);

                    let setIndex = 1;
                    data.fields.forEach(f => {
                        // Ignorar os fields de sistema e a quebra de linha invisível (\u200b)
                        if(f.name !== "Moves Adicionados" && f.name !== "Tipagem" && f.name !== "Base Stats" && f.name !== "\u200b") {
                            if (setIndex <= 4) {
                                setVal(`set${setIndex}-name`, f.name);
                                
                                const abilMatch = f.value.match(/\*\*Ability:\*\* (.*?)\n/);
                                const natMatch = f.value.match(/\*\*Nature:\*\* (.*?)\n/);
                                const itemMatch = f.value.match(/\*\*Item:\*\* (.*?)\n/);
                                const evMatch = f.value.match(/\*\*EVs:\*\* (.*?)\n/);
                                const movesMatch = f.value.split(/\*\*Moves:\*\*\n/);
                                
                                if(abilMatch) setVal(`set${setIndex}-ability`, abilMatch[1]);
                                if(natMatch) setVal(`set${setIndex}-nature`, natMatch[1]);
                                if(itemMatch) setVal(`set${setIndex}-item`, itemMatch[1]);
                                if(evMatch) setVal(`set${setIndex}-evs`, evMatch[1]);
                                
                                if(movesMatch.length > 1) {
                                    const movesClean = movesMatch[1].replace(/• /g, '').trim();
                                    setVal(`set${setIndex}-moves`, movesClean);
                                }
                                setIndex++;
                            }
                        }
                    });
                }

                update();
                closeImportModal();
                alert("✅ Importado com sucesso!");

            } catch(e) {
                alert("❌ Erro ao ler JSON: " + e.message);
            }
        }

        // --- GENERATE & UPDATE ---
        function generateData() {
            const name = getVal('inp-name') || "Nome do Pokémon";
            let desc = getVal('inp-desc');
            const baseMoveset = getVal('inp-base');

            if(baseMoveset) {
                if(desc) desc += "\n\n";
                desc += `> *Moveset base: **${baseMoveset}***.`;
            }

            const colorHex = getVal('inp-color') || "#0a1a34";
            const colorInt = parseInt(colorHex.replace('#', ''), 16) || 661812;

            const embed = {
                title: name,
                description: desc,
                color: colorInt,
                type: "rich",
                footer: { text: "Humble Pixelmon • Custom Dex" },
                fields: []
            };

            const imageVal = getVal('inp-image');
            if(imageVal) {
                embed.image = { url: imageVal };
            }

            const movesAdd = getVal('inp-moves');
            if(movesAdd) {
                embed.fields.push({
                    name: "Moves Adicionados",
                    value: movesAdd,
                    inline: false
                });
            }

            // Lê e armazena os sets preenchidos
            const setsData = [];
            for(let i=1; i<=4; i++) {
                const sName = getVal(`set${i}-name`);
                if(sName) {
                    const sAbility = getVal(`set${i}-ability`) || "-";
                    const sNature = getVal(`set${i}-nature`) || "-";
                    const sItem = getVal(`set${i}-item`) || "-";
                    const sEvs = getVal(`set${i}-evs`) || "-";
                    
                    const sMovesRaw = getVal(`set${i}-moves`).split('\n').filter(m => m.trim());
                    const sMovesStr = sMovesRaw.length > 0 ? sMovesRaw.map(m => `• ${m.trim()}`).join('\n') : "-";
                    
                    const val = `**Ability:** ${sAbility}\n**Nature:** ${sNature}\n**Item:** ${sItem}\n**EVs:** ${sEvs}\n\n**Moves:**\n${sMovesStr}`;
                    
                    setsData.push({
                        name: sName,
                        value: val,
                        inline: true
                    });
                }
            }

            // Insere os sets no embed e aplica a quebra de linha após o 2º set
            setsData.forEach((set, index) => {
                embed.fields.push(set);
                // index 1 representa o 2º item do array. Se houver mais de 2 itens, insere a quebra.
                if (index === 1 && setsData.length > 2) {
                    embed.fields.push({
                        name: "\u200b",
                        value: "\u200b",
                        inline: false
                    });
                }
            });

            return embed;
        }

        function update() {
            const data = generateData();

            // Atualiza Titulo
            document.getElementById('out-title').innerText = data.title;
            
            // Atualiza Descrição com marcação markdown visual
            let descHtml = data.description || "";
            descHtml = descHtml.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
            descHtml = descHtml.replace(/&gt; (.*)/g, '<div class="discord-blockquote">$1</div>');
            descHtml = descHtml.replace(/> (.*)/g, '<div class="discord-blockquote">$1</div>');
            document.getElementById('out-desc').innerHTML = descHtml;

            // Atualiza Cor Lateral
            document.getElementById('embed-preview').style.borderLeftColor = '#' + data.color.toString(16).padStart(6, '0');

            // Atualiza Imagem Grande
            const imgEl = document.getElementById('out-image');
            if(data.image && data.image.url) { 
                imgEl.src = data.image.url; 
                imgEl.style.display = 'block'; 
            } else { 
                imgEl.style.display = 'none'; 
            }

            // Constrói os Fields
            const fieldsContainer = document.getElementById('out-fields');
            fieldsContainer.innerHTML = "";
            
            data.fields.forEach(f => {
                const fieldDiv = document.createElement('div');
                fieldDiv.className = `field-item ${f.inline ? 'inline' : ''}`;
                
                // Se for a quebra de linha invisível, apenas cria o espaço vertical
                if (f.name === "\u200b") {
                    fieldDiv.style.height = '5px';
                } else {
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'field-name';
                    nameDiv.innerText = f.name;
                    
                    const valueDiv = document.createElement('div');
                    valueDiv.className = 'field-value';
                    valueDiv.innerHTML = f.value.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    
                    fieldDiv.appendChild(nameDiv);
                    fieldDiv.appendChild(valueDiv);
                }
                
                fieldsContainer.appendChild(fieldDiv);
            });
        }

        function copyJSON() {
            const data = generateData();
            const jsonStr = JSON.stringify(data, null, 4);
            navigator.clipboard.writeText(jsonStr).then(() => {
                const btn = document.querySelector('.action-btn.copy');
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Copiado!";
                setTimeout(() => btn.innerHTML = originalText, 2000);
            });
        }

        function clearAll() {
            if(confirm("Limpar todos os campos?")) {
                document.querySelectorAll('input, textarea').forEach(el => el.value = '');
                document.getElementById('inp-color').value = '#0a1a34';
                document.getElementById('inp-color-picker').value = '#0a1a34';
                document.getElementById('inp-type-color').value = '#0a1a34';
                update();
            }
        }

        window.addEventListener('load', update);
    </script>
</body>
</html>
